name: Publish CDN

on:
  workflow_run:
    workflows: [Prerelease, Release Minor, Release Major, Release Minor & Major, Hotfix]
    types: [completed]

jobs:
  publish_cdn:
    runs-on: uhg-runner
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v3

      - name: Download artifacts
        continue-on-error: true
        run: gh run download ${{ github.event.workflow_run.id }} -n cdn-dist-files -D cdn-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for CDN artifacts
        id: cdn_artifacts
        run: |
          [ -d "./cdn-dist" ] && echo "exist=true" >> $GITHUB_OUTPUT || echo "exist=false" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/CLI@v2
        env:
          USER: ${{ secrets.AZURE_SERVICE_PRINCIPAL_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_SERVICE_PRINCIPAL_CLIENT_SECRET }}
          TENANT: ${{ secrets.AZURE_SERVICE_PRINCIPAL_TENANT_ID }}
        with:
          azcliversion: latest
          inlineScript: |
            az login --service-principal -u ${{ env.USER }} -p ${{ env.SECRET }} --tenant ${{ env.TENANT }}

      - name: Upload CDN artifacts
        uses: azure/CLI@v2
        if: steps.cdn_artifacts.outputs.exist == 'true'
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch --account-name pmpwebcomponents --overwrite --auth-mode key -d 'pmpwebcomponents' -s ./cdn-dist

      - name: Azure logout
        uses: azure/CLI@v2
        if: steps.cdn_artifacts.outputs.exist == 'true'
        with:
          azcliversion: latest
          inlineScript: |
            az logout

      - name: Archive Logs artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: logs-files
          path: logs
