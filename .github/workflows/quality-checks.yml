name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
  workflow_call:

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  format:
    name: Check Formatting
    runs-on: uhg-runner
    steps:
      - uses: actions/checkout@v1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          skip_gh_install: true

      - name: Cache Prettier Output
        uses: actions/cache@v3
        with:
          path: node_modules/.cache/prettier/.prettier-cache
          key: prettier-${{ hashFiles('yarn.lock') }}

      - name: Check Formatting
        run: yarn format:check --cache

  lint:
    name: Run ESLint
    runs-on: uhg-runner
    steps:
      - uses: actions/checkout@v1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          skip_gh_install: true

      - name: Cache ESLint Output
        uses: actions/cache@v3
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('yarn.lock') }}

      - name: Run ESLint
        # Without the `--max-old-space-size` option, this task will fail with out-of-memory errors on ubuntu-latest.
        # Setting this to 6.5GB, since ubuntu-latest supposedly has 7GB of RAM.
        run: NODE_OPTIONS="--max-old-space-size=6144" yarn lint --cache --cache-strategy content

  build:
    name: Run TypeScript Build
    # Run on hiperf because supposedly it has more CPUs available, and the more CPUs there are available,
    # the faster this job will run
    runs-on: uhg-runner
    steps:
      - uses: actions/checkout@v1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          skip_gh_install: true

      - name: Run TypeScript Build
        # The build:all:ci job runs the TypeScript build on all packages in parallel, with up to 10 jobs
        # running at once.  After some trial and error, 10 parallel jobs seems to be the sweet spot on the hiperf runner
        run: yarn build:all:ci

  unit-test:
    name: Run Unit Tests
    runs-on: uhg-runner
    steps:
      - uses: actions/checkout@v1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          skip_gh_install: true

      - name: Run Jest Unit Tests
        run: yarn test
