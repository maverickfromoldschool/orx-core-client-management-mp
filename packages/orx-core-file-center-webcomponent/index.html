<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microproduct Runtime Wrapper</title>
  </head>
  <body>
    <script>
      window.goToRoute = (routeDetails) => {
        console.log('goToRoute', routeDetails);
      };

      window.trackAnalytics = (data) => {
        console.log('trackAnalytics', data);
      };
    </script>

    <orx-core-file-center
      id="orx-core-file-center-webcomponent"
      text="Hello World"
      route-action="goToRoute"
      analytics-action="trackAnalytics"
    ></orx-core-file-center>
    <script type="module" src="/src/index.tsx"></script>

    <script>
      const element = document.getElementById('orx-core-file-center-webcomponent');
      element.addEventListener('event', (e) => {
        console.log('event', e);
      });
    </script>
  </body>
</html>
